# Publishes the package to npm when a GitHub release is created.
#
# Authentication uses npm Trusted Publishing (OIDC): the package on npmjs.com
# trusts this repository and this workflow file, so no token is stored in the
# repository. npm also attaches provenance to the published version.

name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish
